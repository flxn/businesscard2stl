server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # relative redirects (e.g. /de → /de/), so they keep https behind a TLS-terminating proxy like Coolify's
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml model/stl text/plain application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # hashed build output never changes
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # always revalidate the pages (/, /de/, …) so new deployments show up immediately
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # only real files and the language pages (/de/ → /de/index.html) exist; anything else is a real 404,
  # so search engines never index duplicates of the start page
  location / {
    try_files $uri $uri/ =404;
  }
}
